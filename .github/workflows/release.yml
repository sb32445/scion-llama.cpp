name: release

# Prebuilt fork binaries so users do NOT have to build — this is the durable
# fix for the "unknown model architecture: 'mtp'" class of report. Draft:
# validate with workflow_dispatch before tagging a release.
#
# Notes learned from the first dispatch:
#  - GitHub Linux runners have ~7 GB RAM; `-j` (all cores) OOM-kills cc1plus.
#    Always build with -j 2 and a reduced target surface.
#  - container jobs need cmake/g++/git installed first.
#  - CUDA/HIP arch lists contain ';' — quote them.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux-cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF -DGGML_NATIVE=OFF
          cmake --build build -j 2 --target llama-cli llama-server
      - run: tar -czf linux-x64-cpu.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64-cpu, path: linux-x64-cpu.tar.gz }

  linux-vulkan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo add-apt-repository -y universe
          sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libvulkan-dev glslc
      - run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF -DGGML_VULKAN=ON
          cmake --build build -j 2 --target llama-cli llama-server
      - run: tar -czf linux-x64-vulkan.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64-vulkan, path: linux-x64-vulkan.tar.gz }

  linux-cuda:
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    steps:
      - run: apt-get update && apt-get install -y cmake g++ git
      - uses: actions/checkout@v4
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF \
            -DGGML_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=52;61;70;75;80;86;89"
          cmake --build build -j 2 --target llama-cli llama-server
      - run: tar -czf linux-x64-cuda.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64-cuda, path: linux-x64-cuda.tar.gz }

  linux-hip:
    runs-on: ubuntu-22.04
    container: rocm/dev-ubuntu-22.04:6.2
    steps:
      - run: apt-get update && apt-get install -y cmake g++ git hipblas-dev rocblas-dev
      - uses: actions/checkout@v4
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF \
            -DCMAKE_PREFIX_PATH=/opt/rocm -DGGML_HIP=ON "-DAMDGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1150"
          cmake --build build -j 2 --target llama-cli llama-server
      - run: tar -czf linux-x64-hip.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64-hip, path: linux-x64-hip.tar.gz }

  linux-sycl:
    runs-on: ubuntu-22.04
    container: intel/oneapi-basekit:latest
    steps:
      - run: apt-get update && apt-get install -y cmake g++ git
      - uses: actions/checkout@v4
      - run: |
          set +e; . /opt/intel/oneapi/setvars.sh; set -e
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF -DGGML_SYCL=ON
          cmake --build build -j 2 --target llama-cli llama-server
      - run: tar -czf linux-x64-sycl.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with: { name: linux-x64-sycl, path: linux-x64-sycl.tar.gz }

  macos-arm64-metal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF -DGGML_METAL=ON
          cmake --build build -j 2 --target llama-cli llama-server
      - run: tar -czf macos-arm64-metal.tar.gz -C build/bin .
      - uses: actions/upload-artifact@v4
        with: { name: macos-arm64-metal, path: macos-arm64-metal.tar.gz }

  windows-x64-cpu:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_WEBUI=OFF -DGGML_NATIVE=OFF
      - run: cmake --build build --config Release -j 2 --target llama-cli llama-server
      - run: Compress-Archive -Path build/bin/Release/* -DestinationPath windows-x64-cpu.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: { name: windows-x64-cpu, path: windows-x64-cpu.zip }

  release:
    needs: [linux-cpu, linux-vulkan, linux-cuda, linux-hip, linux-sycl, macos-arm64-metal, windows-x64-cpu]
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: false
          body: |
            Fork binaries for `moe-corr-runtime` (Prism PQ2_0 container +
            embedded adapters + the `draft-mtp-sidecar` drafter).
            Load `Scion-35B-A3B` and its k=1 MTP drafter without a build.
            See the drafter card for usage.
