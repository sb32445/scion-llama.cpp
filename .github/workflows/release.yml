name: release

# Builds fork binaries so users do NOT have to build (the fix for the
# "unknown model architecture: 'mtp'" class of report). Draft: validate on a
# workflow_dispatch run before relying on it.
#
# Artifacts per backend are attached to the GitHub Release for a v* tag.
# HIP/SYCL/CUDA use upstream container images (no GPU needed to compile).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-cpu
            os: ubuntu-22.04
            cmake: -DGGML_NATIVE=OFF
          - name: linux-x64-vulkan
            os: ubuntu-22.04
            cmake: -DGGML_VULKAN=ON
            apt: libvulkan-dev glslang-tools
          - name: linux-x64-cuda
            os: ubuntu-22.04
            container: nvidia/cuda:12.4.1-devel-ubuntu22.04
            cmake: -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=52;61;70;75;80;86;89
          - name: linux-x64-hip
            os: ubuntu-22.04
            container: rocm/dev-ubuntu-22.04:6.2
            cmake: -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx1030;gfx1100;gfx1101;gfx1102;gfx1150
          - name: linux-x64-sycl
            os: ubuntu-22.04
            container: intel/oneapi-basekit:latest
            cmake: -DGGML_SYCL=ON
          - name: macos-arm64-metal
            os: macos-14
            cmake: -DGGML_METAL=ON
          - name: windows-x64-cpu
            os: windows-2022
            cmake: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@v4
      - name: deps
        if: matrix.apt != ''
        run: |
          apt-get update && apt-get install -y --no-install-recommends cmake g++ git ${{ matrix.apt }}
      - name: configure + build
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF ${{ matrix.cmake }}
          cmake --build build -j --target llama-cli llama-server llama-bench
      - name: package
        shell: bash
        run: |
          mkdir -p dist
          find build/bin -maxdepth 1 -type f \( -name 'llama-*' -o -name '*.so*' -o -name '*.dll' -o -name '*.dylib' \) \
            -exec cp -a {} dist/ \; 2>/dev/null || true
          tar -czf ${{ matrix.name }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          fail_on_unmatched_files: false
          body: |
            Fork binaries for `moe-corr-runtime` (Prism PQ2_0 container +
            embedded adapters + the `draft-mtp-sidecar` drafter).
            These load `Scion-35B-A3B` and its k=1 MTP drafter without a build.
            See the drafter card for usage.
